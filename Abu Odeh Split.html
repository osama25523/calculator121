* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #1e1e2f, #2b2b45, #12121a);
  color: #f5f5f5;
  min-height: 100vh;
}

.market-back {
  position: fixed;
  top: 20px;
  left: 20px;
  background: linear-gradient(135deg, #ff9f1c, #ffbf69);
  color: #000;
  padding: 10px 16px;
  border-radius: 10px;
  font-weight: bold;
  text-decoration: none;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  z-index: 999;
}

.wrap {
  max-width: 900px;
  margin: 40px auto;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
  padding: 28px;
}

h1 {
  margin: 0 0 14px;
  font-size: 34px;
  text-align: center;
  color: #ffd369;
}

p {
  margin: 8px 0;
  line-height: 1.8;
}

.muted {
  color: #f0f0f0;
  text-align: center;
}

.card {
  background: rgba(255,255,255,0.04);
  border-radius: 18px;
  padding: 22px;
  margin-top: 18px;
}

.dropzone {
  display: block;
  border: 2px dashed #ffd369;
  border-radius: 16px;
  padding: 32px 24px;
  text-align: center;
  background: rgba(255,255,255,0.03);
  transition: 0.3s ease;
  cursor: pointer;
}

.dropzone:hover,
.dropzone.dragover {
  background: rgba(255,211,105,0.12);
  border-color: #ffbf69;
}

input[type="file"] {
  display: none;
}

.btns {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 18px;
  justify-content: center;
}

button {
  border: none;
  border-radius: 12px;
  padding: 14px 22px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: linear-gradient(135deg, #ff9f1c, #ffbf69);
  color: #000;
  transition: 0.3s ease;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(255,159,28,0.4);
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.secondary {
  background: #555;
  color: #fff;
}

.secondary:hover {
  background: #666;
}

.status, .results {
  margin-top: 18px;
  padding: 16px;
  border-radius: 12px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.08);
  white-space: pre-line;
}

.results ul {
  margin: 8px 0 0;
  padding-left: 22px;
}

.note {
  background: rgba(255,211,105,0.12);
  border-left: 5px solid #ffd369;
  padding: 12px 14px;
  border-radius: 10px;
  margin-top: 18px;
}

@media (max-width: 700px) {
  .wrap {
    margin: 80px 14px 30px;
    padding: 20px;
  }

  h1 {
    font-size: 26px;
  }

  .market-back {
    left: 14px;
    top: 14px;
  }
}
</style>


</head>
<body>

<a href="Market.html" class="market-back">⬅ Back to Market</a>

  <div class="wrap">
    <h1>Abu Odeh</h1>
       <div class="card">
      <label class="dropzone" id="dropzone" for="fileInput">
        <div style="font-size: 22px; font-weight: bold; margin-bottom: 8px;">Upload Excel File Here</div>
        <div>Click to select or drag & drop file</div>
        <div id="fileName" class="muted" style="margin-top: 10px;">No file selected</div>
      </label>
      <input type="file" id="fileInput" accept=".xlsx,.xls" />

      <div class="btns">
        <button id="processBtn" disabled>Process & Download ZIP</button>
        <button id="clearBtn" class="secondary">Clear</button>
      </div>

      
      <div id="status" class="status">Ready.</div>
      <div id="results" class="results" style="display:none;"></div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const fileName = document.getElementById('fileName');
    const processBtn = document.getElementById('processBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusBox = document.getElementById('status');
    const resultsBox = document.getElementById('results');

    let selectedFile = null;
    const CHUNK_SIZE = 20000;

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function setFile(file) {
      selectedFile = file || null;
      fileName.textContent = selectedFile ? Selected file: ${selectedFile.name} : 'No file selected';
      processBtn.disabled = !selectedFile;
      resultsBox.style.display = 'none';
      resultsBox.innerHTML = '';
      setStatus(selectedFile ? 'File ready for processing.' : 'Ready.');
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (file) setFile(file);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.remove('dragover');
      });
    });

    dropzone.addEventListener('drop', (e) => {
      const file = e.dataTransfer?.files?.[0];
      if (file) {
        fileInput.files = e.dataTransfer.files;
        setFile(file);
      }
    });

    clearBtn.addEventListener('click', () => {
      fileInput.value = '';
      setFile(null);
    });

    function normalizeThirdColumn(row) {
      if (!Array.isArray(row)) return row;
      const newRow = [...row];
      if (newRow.length >= 3) {
        const value = newRow[2];
        if (value === 1 || value === '1') {
          newRow[2] = '';
        }
      }
      return newRow;
    }

    function splitArray(arr, size) {
      const chunks = [];
      for (let i = 0; i < arr.length; i += size) {
        chunks.push(arr.slice(i, i + size));
      }
      return chunks;
    }

    function getBaseFileName(name) {
      return name.replace(/\.[^/.]+$/, '');
    }

    processBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        alert('Please select an Excel file first.');
        return;
      }

      processBtn.disabled = true;
      setStatus('Reading file...');
      resultsBox.style.display = 'none';
      resultsBox.innerHTML = '';

      try {
        const buffer = await selectedFile.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: 'array' });

        if (!workbook.SheetNames.length) {
          throw new Error('No sheets found in file.');
        }

        const firstSheetName = workbook.SheetNames[0];
        const sheet = workbook.Sheets[firstSheetName];
        const allRows = XLSX.utils.sheet_to_json(sheet, {
          header: 1,
          defval: '',
          raw: false
        });

        if (!allRows.length) {
          throw new Error('First sheet is empty.');
        }

        const headerRow = Array.isArray(allRows[0]) ? [...allRows[0]] : [];
        const dataRows = allRows.slice(1).map(normalizeThirdColumn);
        const chunks = splitArray(dataRows, CHUNK_SIZE);

        if (!chunks.length) {
          chunks.push([]);
        }

        setStatus(Creating ${chunks.length} Excel file(s)...);

        const zip = new JSZip();
        const baseName = getBaseFileName(selectedFile.name);
        const generatedNames = [];

        chunks.forEach((chunk, index) => {
          const outputRows = [headerRow, [], ...chunk];
          const outWb = XLSX.utils.book_new();
          const outWs = XLSX.utils.aoa_to_sheet(outputRows);
          XLSX.utils.book_append_sheet(outWb, outWs, firstSheetName);

          const excelArray = XLSX.write(outWb, {
            bookType: 'xlsx',
            type: 'array'
          });

          const fileName = ${baseName}_part_${index + 1}.xlsx;
          generatedNames.push(fileName);
          zip.file(fileName, excelArray);
        });

        setStatus('Zipping files...');
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const zipName = ${baseName}_split_files.zip;

        const link = document.createElement('a');
        link.href = URL.createObjectURL(zipBlob);
        link.download = zipName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);

        resultsBox.style.display = 'block';
        resultsBox.innerHTML = 
          <strong>Process completed successfully.</strong>
          <ul>
            <li>Sheet name: ${escapeHtml(firstSheetName)}</li>
            <li>Total rows: ${dataRows.length.toLocaleString()}</li>
            <li>Generated files: ${generatedNames.length}</li>
            <li>Rows per file: ${CHUNK_SIZE.toLocaleString()} صف بيانات</li>
            <li>Header kept, second row empty in each file</li>
            <li>Any '1' in column 3 replaced with empty</li>
          </ul>
          <strong>Generated files:</strong>
          <ul>${generatedNames.map(name => <li>${escapeHtml(name)}</li>).join('')}</ul>
        ;

        setStatus('Download completed.');
      } catch (error) {
        console.error(error);
        setStatus('Error during processing.');
        resultsBox.style.display = 'block';
        resultsBox.textContent = Reason: ${error.message || error};
      } finally {
        processBtn.disabled = !selectedFile;
      }
    });
  </script>
</body>
</html>
