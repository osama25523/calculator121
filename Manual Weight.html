<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weight Calculator Sheet</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      min-height: 100vh;
      color: #1d2430;
      padding: 18px;
      background:
        radial-gradient(circle at 15% 10%, rgba(37, 165, 91, .30), transparent 28%),
        radial-gradient(circle at 85% 15%, rgba(255, 196, 87, .35), transparent 25%),
        linear-gradient(135deg, #eef8f1 0%, #f7fbff 48%, #fff7e3 100%);
    }

    .back-btn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 50;
      text-decoration: none;
      background: #1f7a3f;
      color: white;
      padding: 10px 16px;
      border-radius: 999px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(31, 122, 63, .25);
      transition: .2s;
    }
    .back-btn:hover { transform: translateY(-2px); background: #176231; }

    .app {
      max-width: 820px;
      margin: 42px auto 0;
      background: rgba(255,255,255,.92);
      border-radius: 24px;
      box-shadow: 0 18px 45px rgba(29,36,48,.14);
      overflow: hidden;
      border: 1px solid rgba(31, 122, 63, .18);
      backdrop-filter: blur(8px);
    }

    .header {
      background: linear-gradient(135deg, #174d2b, #25a55b 55%, #ffb84d);
      color: white;
      padding: 24px 18px;
      text-align: center;
      position: relative;
    }
    .header:after {
      content: "";
      position: absolute;
      inset: auto -30px -42px -30px;
      height: 70px;
      background: rgba(255,255,255,.16);
      border-radius: 50%;
    }
    .header h1 { margin: 0 0 8px; font-size: 27px; letter-spacing: .3px; }
    .header p { margin: 0; opacity: .96; font-size: 14px; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 130px 1fr;
      gap: 12px;
      padding: 18px;
      background: #ffffff;
      border-bottom: 1px solid #dce7df;
      align-items: end;
    }

    .box label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: #174d2b;
      font-size: 13px;
    }

    input, select {
      width: 100%;
      height: 38px;
      border: 1px solid #bed1c5;
      border-radius: 10px;
      padding: 7px 9px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }
    input:focus, select:focus {
      border-color: #25a55b;
      box-shadow: 0 0 0 3px rgba(37, 165, 91, .14);
    }

    .example {
      margin: 14px 18px 0;
      padding: 12px 14px;
      color: #45515f;
      font-size: 13px;
      background: linear-gradient(135deg, #f2fff6, #fff8e8);
      border: 1px solid #dcebdc;
      border-radius: 14px;
    }

    .table-wrap { padding: 16px 18px 12px; overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border: 1px solid #b7c9bd;
      table-layout: fixed;
      box-shadow: 0 8px 18px rgba(31, 122, 63, .07);
    }

    th, td {
      border: 1px solid #b7c9bd;
      height: 34px;
      text-align: center;
      font-size: 13px;
      overflow: hidden;
    }

    th {
      background: linear-gradient(180deg, #eaf6ee, #dcebe2);
      font-weight: bold;
      color: #26352c;
      height: 38px;
    }

    .row-num { width: 42px; background: #eef5f0; font-weight: bold; color: #52645a; }
    .weight-col { width: 160px; }
    .unit-col { width: 120px; }
    .result-col { width: 160px; }

    td input, td select {
      border: 0;
      border-radius: 0;
      height: 100%;
      text-align: center;
      background: transparent;
      font-size: 13px;
      padding: 4px;
    }
    td input:focus, td select:focus { box-shadow: inset 0 0 0 2px #25a55b; }

    .result {
      font-weight: bold;
      color: #0f6b35;
      background: #fbfffc;
    }

    .btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 0 18px 16px;
    }

    button {
      border: 0;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      font-weight: bold;
      background: #1f8f4d;
      color: white;
      box-shadow: 0 8px 18px rgba(31, 143, 77, .18);
      transition: .2s;
    }
    button:hover { transform: translateY(-2px); }
    button.secondary { background: #52616f; }

    .note {
      padding: 0 18px 18px;
      color: #5c6875;
      font-size: 13px;
      line-height: 1.6;
    }

    @media (max-width: 750px) {
      body { padding: 12px; }
      .app { margin-top: 50px; }
      .controls { grid-template-columns: 1fr; }
      .header h1 { font-size: 22px; }
      .back-btn { top: 10px; left: 10px; padding: 9px 14px; }
      table { min-width: 520px; }
    }
  </style>
</head>
<body>
  <a class="back-btn" href="index.html">⬅ Back</a>

  <div class="app">
    <div class="header">
      <h1>Weight Calculator Sheet</h1>
      <p>Excel-style calculator for Kilogram and Gram values.</p>
    </div>

    <div class="controls">
      <div class="box">
        <label>Base Weight</label>
        <input id="baseWeight" type="number" step="any" value="1" oninput="calculateAll()" />
      </div>
      <div class="box">
        <label>Base Unit</label>
        <select id="baseUnit" onchange="calculateAll()">
          <option value="kg" selected>Kilogram</option>
          <option value="g">Gram</option>
        </select>
      </div>
      <div class="box">
        <label>Base Value</label>
        <input id="baseValue" type="number" step="any" value="10" oninput="calculateAll()" />
      </div>
    </div>

    <div class="example">
      Example: If 1 Kilogram = 10, then 1.1 Kilogram = 11. If you type 500 Gram, the result will be 5.
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="row-num">#</th>
            <th class="weight-col">A<br>Weight</th>
            <th class="unit-col">B<br>Unit</th>
            <th class="result-col">C<br>Result</th>
          </tr>
        </thead>
        <tbody id="sheetBody"></tbody>
      </table>
    </div>

    <div class="btns">
      <button onclick="addRows(10)">+ Add 10 Rows</button>
      <button class="secondary" onclick="clearSheet()">Clear Sheet</button>
    </div>

    <div class="note">
      Write any weight, choose Gram or Kilogram, and the result will appear automatically.
    </div>
  </div>

  <script>
    const sheetBody = document.getElementById('sheetBody');

    function toGrams(value, unit) {
      return unit === 'kg' ? value * 1000 : value;
    }

    function makeRow(index) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="row-num">${index}</td>
        <td><input type="number" step="any" placeholder="Weight" oninput="calculateRow(this.closest('tr'))"></td>
        <td>
          <select onchange="calculateRow(this.closest('tr'))">
            <option value="kg" selected>Kg</option>
            <option value="g">Gram</option>
          </select>
        </td>
        <td class="result"></td>
      `;
      return tr;
    }

    function addRows(count) {
      const current = sheetBody.children.length;
      for (let i = 1; i <= count; i++) {
        sheetBody.appendChild(makeRow(current + i));
      }
    }

    function formatNumber(num) {
      if (!isFinite(num)) return '';
      return Number(num.toFixed(6)).toString();
    }

    function calculateRow(row) {
      const baseWeight = parseFloat(document.getElementById('baseWeight').value);
      const baseUnit = document.getElementById('baseUnit').value;
      const baseValue = parseFloat(document.getElementById('baseValue').value);
      const weightInput = row.children[1].querySelector('input');
      const unitSelect = row.children[2].querySelector('select');
      const resultCell = row.children[3];
      const weight = parseFloat(weightInput.value);

      if (!baseWeight || isNaN(baseWeight) || isNaN(baseValue) || isNaN(weight)) {
        resultCell.textContent = '';
        return;
      }

      const baseInGrams = toGrams(baseWeight, baseUnit);
      const rowInGrams = toGrams(weight, unitSelect.value);
      const result = (rowInGrams / baseInGrams) * baseValue;
      resultCell.textContent = formatNumber(result);
    }

    function calculateAll() {
      document.querySelectorAll('#sheetBody tr').forEach(calculateRow);
    }

    function clearSheet() {
      document.querySelectorAll('#sheetBody input').forEach(input => input.value = '');
      document.querySelectorAll('.result').forEach(cell => cell.textContent = '');
    }

    addRows(25);
  </script>
</body>
</html>
