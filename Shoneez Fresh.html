<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Excel Price Formatter</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    *{box-sizing:border-box}
    :root{
      --bg:#0b1220;
      --card:#111827;
      --line:#263244;
      --text:#f8fafc;
      --muted:#94a3b8;
      --accent:#3b82f6;
      --accent2:#2563eb;
      --danger:#f87171;
    }
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Inter,Segoe UI,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 15%,rgba(59,130,246,.18),transparent 28%),
        radial-gradient(circle at 80% 85%,rgba(37,99,235,.12),transparent 28%),
        var(--bg);
    }
    .wrap{
      width:min(560px,100%);
    }
    .back{
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:14px;
      padding:9px 13px;
      border:1px solid var(--line);
      border-radius:10px;
      background:#0f172a;
      color:#cbd5e1;
      text-decoration:none;
      font-size:14px;
      font-weight:700;
      transition:.2s;
    }
    .back:hover{
      border-color:var(--accent);
      color:#fff;
      transform:translateY(-1px);
    }
    .card{
      width:100%;
      background:rgba(17,24,39,.96);
      border:1px solid var(--line);
      border-radius:22px;
      padding:30px;
      box-shadow:0 24px 60px rgba(0,0,0,.35);
      backdrop-filter:blur(10px);
    }
    h1{
      font-size:27px;
      margin:0 0 8px;
      text-align:center;
      letter-spacing:-.4px;
    }
    .subtitle{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      margin:0 0 24px;
    }
    .upload{
      display:block;
      border:2px dashed #3a475c;
      border-radius:16px;
      padding:34px 20px;
      text-align:center;
      cursor:pointer;
      background:#0b1220;
      transition:.2s;
    }
    .upload:hover{
      border-color:var(--accent);
      background:#101a2d;
      transform:translateY(-1px);
    }
    .upload strong{
      display:block;
      font-size:17px;
      margin-bottom:7px;
      color:#fff;
    }
    .upload span{
      font-size:13px;
      color:var(--muted);
    }
    input[type=file]{display:none}
    .file-name{
      margin:14px 0 0;
      font-size:13px;
      color:#cbd5e1;
      text-align:center;
      min-height:18px;
      word-break:break-word;
    }
    button{
      width:100%;
      margin-top:24px;
      padding:14px 16px;
      border:0;
      border-radius:12px;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:white;
      transition:.2s;
    }
    button:disabled{
      background:#334155;
      color:#94a3b8;
      cursor:not-allowed;
    }
    button:not(:disabled):hover{
      transform:translateY(-1px);
      box-shadow:0 10px 28px rgba(37,99,235,.28);
    }
    .status{
      margin-top:14px;
      text-align:center;
      font-size:13px;
      color:var(--muted);
      min-height:18px;
    }
    .error{color:var(--danger)}
    @media(max-width:560px){
      body{padding:16px}
      .card{padding:22px}
      h1{font-size:23px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="Market.html">← Back</a>
    <div class="card">
      <h1>Shoneez Fresh</h1>
      <p class="subtitle">Upload your Excel file and download the formatted version.</p>

    <label class="upload" for="excelFile">
      <strong>Upload Excel File</strong>
      <span>.xlsx or .xls</span>
    </label>
    <input id="excelFile" type="file" accept=".xlsx,.xls" />
    <div id="fileName" class="file-name"></div>

    <button id="downloadBtn" disabled>Download File</button>
    <div id="status" class="status"></div>
    </div>
  </div>

<script>
(() => {
  const fileInput = document.getElementById('excelFile');
  const fileName = document.getElementById('fileName');
  const downloadBtn = document.getElementById('downloadBtn');
  const status = document.getElementById('status');

  let outputWorkbook = null;
  let outputName = 'processed.xlsx';

  const col = (row, index) => row[index] ?? '';

  function toNumber(value) {
    if (typeof value === 'number' && Number.isFinite(value)) return value;
    if (value === null || value === undefined || value === '') return NaN;
    const cleaned = String(value).replace(/,/g, '').replace(/[^0-9.+-]/g, '').trim();
    const n = Number(cleaned);
    return Number.isFinite(n) ? n : NaN;
  }

  // Same result as Excel CEILING(number, 0.05) for normal positive prices.
  function ceiling005(value) {
    if (!Number.isFinite(value)) return '';
    if (value === 0) return 0;
    const result = Math.ceil((value - 1e-10) / 0.05) * 0.05;
    return Number(result.toFixed(2));
  }

  function buildOutput(firstSheet) {
    // Read displayed/raw cells from the first worksheet only.
    const rows = XLSX.utils.sheet_to_json(firstSheet, {
      header: 1,
      raw: true,
      defval: ''
    });

    if (!rows.length) throw new Error('The first sheet is empty.');

    const sourceHeader = rows[0] || [];

    // Final output:
    // A = source K
    // B = final price M after moving I -> H. In this workbook M = CEILING(L * H, 0.05),
    //     so H is treated as the value from I and M is recalculated here.
    // C = blank
    // D = 0 for all data rows
    // Row 2 = inserted blank row
    // Columns after D do not exist.
    const out = [];

    // Keep mapped headers on row 1. D keeps the original N header while all data below it are 0.
    out.push([
      col(sourceHeader, 10),  // K1
      col(sourceHeader, 12),  // M1
      '',                     // C1 blank
      col(sourceHeader, 13)   // N1 header
    ]);

    // Insert a blank row after row 1.
    out.push(['', '', '', '']);

    for (let r = 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const sku = col(row, 10);       // K
      const priceI = toNumber(col(row, 8));  // I -> H internally
      const unitL = toNumber(col(row, 11));  // L

      let finalPrice = '';
      if (Number.isFinite(priceI) && Number.isFinite(unitL)) {
        finalPrice = ceiling005(priceI * unitL);
      } else {
        // Fallback only when the source already contains a usable numeric M value.
        const existingM = toNumber(col(row, 12));
        if (Number.isFinite(existingM)) finalPrice = existingM;
      }

      // Skip completely empty trailing rows.
      const hasAnything = row.some(v => v !== '' && v !== null && v !== undefined);
      if (!hasAnything) continue;

      out.push([sku, finalPrice, '', 0]);
    }

    const ws = XLSX.utils.aoa_to_sheet(out);

    // Simple practical widths. Only A:D are created.
    ws['!cols'] = [
      { wch: 22 },
      { wch: 16 },
      { wch: 8 },
      { wch: 16 }
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
    return wb;
  }

  fileInput.addEventListener('change', async () => {
    downloadBtn.disabled = true;
    outputWorkbook = null;
    status.textContent = '';
    status.className = 'status';

    const file = fileInput.files?.[0];
    if (!file) {
      fileName.textContent = '';
      return;
    }

    fileName.textContent = file.name;

    try {
      const buffer = await file.arrayBuffer();
      const wb = XLSX.read(buffer, { type: 'array', cellFormula: true, cellNF: true, cellStyles: true });
      if (!wb.SheetNames.length) throw new Error('No worksheet found.');

      const firstSheet = wb.Sheets[wb.SheetNames[0]];
      outputWorkbook = buildOutput(firstSheet);

      const base = file.name.replace(/\.(xlsx|xls)$/i, '');
      outputName = `${base}_ready.xlsx`;
      downloadBtn.disabled = false;
      status.textContent = 'File is ready.';
    } catch (err) {
      status.textContent = err?.message || 'Could not process the file.';
      status.className = 'status error';
    }
  });

  downloadBtn.addEventListener('click', () => {
    if (!outputWorkbook) return;
    XLSX.writeFile(outputWorkbook, outputName, { bookType: 'xlsx', compression: true });
  });
})();
</script>
</body>
</html>
