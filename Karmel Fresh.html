  if (!code.endsWith('KR')) code += 'KR';
  return code;
}
function parsePrice(value) {
  if (typeof value === 'number') return isFinite(value) ? value : 0;
  let s = String(value ?? '').replace(/,/g, '').replace(/[^0-9.\-]/g, '').trim();
  let n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
function readExcel(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      resolve(XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' }));
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}

async function processFiles() {
  const file1 = document.getElementById('excel1').files[0];
  const file2 = document.getElementById('excel2').files[0];
  const btn = document.getElementById('runBtn');
  if (!file1 || !file2) { alert('ارفع الملفين الأول والثاني.'); return; }
  try {
    btn.disabled = true;
    setStatus('جاري قراءة الملفات...');
    const excel1 = await readExcel(file1);
    const excel2 = await readExcel(file2);

    setStatus('جاري تجهيز خريطة المطابقة من Excel الثاني...');
    const mapExcel2 = new Map();
    for (const row of excel2) {
      const jVal = normalizeCode(row[9]);
      if (jVal) mapExcel2.set(jVal, row[10]);
    }

    setStatus('جاري فلترة Excel الأول وحذف غير المطلوب...');
    const rows = [];
    let skipped = 0;
    for (const sourceRow of excel1) {
      if (!sourceRow || sourceRow.length === 0) continue;
      const row = [...sourceRow];
      const code = normalizeCode(row[0]);
      if (!code) continue;
      row[0] = code;
      if (!allowedCodes.has(code)) { skipped++; continue; }
      rows.push(row);
    }

    setStatus('جاري حذف التكرار والاحتفاظ بأعلى سعر...');
    const unique = new Map();
    for (const row of rows) {
      const code = row[0];
      const price = parsePrice(row[1]);
      if (!unique.has(code) || price > parsePrice(unique.get(code)[1])) unique.set(code, row);
    }
// إضافة الأكواد الناقصة تلقائياً
allowedCodes.forEach(code => {
  if (!unique.has(code)) {
    unique.set(code, [code, 0, 0]);
  }
});
    let matched = 0, notMatched = 0, d4 = 0, d2 = 0;
    const finalRows = Array.from(unique.values());

    setStatus('جاري تقسيم الأسعار والمطابقة مع Excel الثاني...');
    for (const row of finalRows) {
      const code = row[0];
      const price = parsePrice(row[1]);
      if (code === '80068KR' || code === '80125KR') {
        row[1] = price * 7;
      }
      else if (code === '80070KR' || code === '80075KR') {
        row[1] = price * 4;
      }
      else if (divideBy4.has(code)) { row[1] = price / 4; d4++; }
      else if (divideBy2.has(code)) { row[1] = price / 2; d2++; }

      if (!preserveThirdColumn.has(code)) {
        if (mapExcel2.has(code)) { row[2] = mapExcel2.get(code); matched++; }
        else { row[2] = 0; notMatched++; }
      }

      // تنظيف نهائي للعمود الثالث لكل الأكواد:
      // الصفر يبقى صفر، وأي قيمة ثانية تصبح فاضية
      if (String(row[2]).trim() !== '0') {
        row[2] = '';
      }
    }

finalRows.unshift([]);
finalRows.unshift([]);
    const ws = XLSX.utils.aoa_to_sheet(finalRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Processed');
    XLSX.writeFile(wb, 'KR_Processed.xlsx');

    setStatus(`تم بنجاح ✅

الصفوف النهائية: ${finalRows.length - 1}
المحذوفة لأنها ليست بالقائمة: ${skipped}
المطابقة من Excel الثاني: ${matched}
غير موجودة في Excel الثاني وتم وضع 0: ${notMatched}
تم تقسيم ÷4: ${d4}
تم تقسيم ÷2: ${d2}

تم تنزيل ملف KR_Processed.xlsx`);
  } catch (err) {
    console.error(err);
    setStatus('صار خطأ أثناء المعالجة. تأكد أن الملفات Excel صحيحة.');
  } finally {
    btn.disabled = false;
  }
}
